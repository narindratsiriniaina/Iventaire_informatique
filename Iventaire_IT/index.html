<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./style/fontawesome-free-6.5.0-web/svgs/brands/figma.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestion de Suivie et d'Inventaire de Materiel Informatique</title>
    
    <!-- Intégration de Tailwind CSS pour les nouvelles vues -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#004d40",
                        "primary-container": "#00332a",
                        background: "#f8faf7",
                        "on-surface-variant": "#3f4945",
                        "outline-variant": "#bfc9c4",
                    },
                    spacing: {
                        "stack-lg": "24px",
                        "stack-md": "16px",
                    },
                    fontSize: {
                        "display-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    }
                }
            }
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }
        /* Éviter le conflit Bootstrap/Tailwind sur les liens */
        a { text-decoration: none; }
    </style>

    <link rel="stylesheet" href="/src/theme.css">
